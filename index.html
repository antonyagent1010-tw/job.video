<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>職缺短影音牆｜聯成電腦</title>
<meta name="description" content="一分鐘看懂一個職缺。聯成電腦學員看完短影音，線上登記，就輔老師協助推薦與安排面試。">
<meta property="og:title" content="職缺短影音牆｜聯成電腦">
<meta property="og:description" content="一分鐘看懂一個職缺。看完想應徵，線上登記就好。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 版型沿用「學員AI分享牆」：同一套字體、底色與卡片，改成直式短影音的比例 */
:root{
  --bg:#E9EAEC;
  --surface:#FFFFFF;
  --ink:#16171A;
  --muted:#5F636A;
  --line:rgba(22,23,26,.13);
  --accent:#E8481C;
  --accent-deep:#C93A12;
  --navy:#14213D;
  --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif;
  --pad:clamp(16px,5vw,64px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}

/* ---------- header ---------- */
.masthead{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:14px max(var(--pad),env(safe-area-inset-right,0px)) 14px max(var(--pad),env(safe-area-inset-left,0px));
  background:rgba(233,234,236,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.mark{
  display:flex;align-items:baseline;gap:9px;
  font-weight:700;letter-spacing:.02em;text-decoration:none;color:inherit;
}
.mark b{font-size:17px}
.mark span{font-size:13px;color:var(--muted);font-weight:400}
.mark i{
  width:9px;height:9px;background:var(--accent);border-radius:50%;
  display:inline-block;font-style:normal;transform:translateY(-1px)
}

/* ---------- 錄取榜單跑馬燈 ---------- */
.ticker{background:#F4F5F7;border-top:1px solid var(--line);padding-block:18px 22px}
.ticker-head{
  display:grid;gap:1px;
  padding:0 max(var(--pad),env(safe-area-inset-right,0px)) 9px max(var(--pad),env(safe-area-inset-left,0px));
}
.ticker-head b{font-family:var(--serif);font-size:16px;font-weight:600}
.ticker-head span{font-size:14px;color:var(--accent-deep);font-weight:500}
.ticker-view{overflow:hidden}
.ticker-track{display:flex;width:max-content;animation:ticker 46s linear infinite}
.ticker-view:hover .ticker-track,.ticker-view:focus-within .ticker-track{animation-play-state:paused}
.ticker-set{display:flex;gap:14px;list-style:none;margin:0;padding:0 14px 0 0}
@keyframes ticker{to{transform:translateX(-50%)}}
.hired{
  flex:none;display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:9px 18px 9px 10px
}
.hired .face{
  width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  background:var(--navy);color:#fff;font-family:var(--serif);font-size:20px;font-weight:600
}
.hired .face img{width:100%;height:100%;object-fit:cover}
.hired .top{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--muted);white-space:nowrap}
.hired .role{background:var(--navy);color:#fff;font-size:12.5px;padding:1px 8px;border-radius:4px;line-height:1.7}
.hired .firm{font-size:15px;white-space:nowrap;margin-top:2px}

/* ---------- hero ---------- */
.hero{
  padding:clamp(36px,6vw,72px) var(--pad) clamp(28px,4vw,44px);
  display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);
  gap:clamp(24px,4vw,56px);align-items:center;
}
.hero h1{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(36px,6.2vw,70px);line-height:1.14;
  margin:0 0 18px;letter-spacing:.01em;text-wrap:balance;
}
.hero p{margin:0;max-width:34em;color:#33363C;font-size:clamp(15px,1.6vw,17px)}
.steps{
  list-style:none;margin:22px 0 0;padding:0;
  display:flex;flex-wrap:wrap;gap:6px 10px;font-size:14px;font-weight:500;
}
.steps li{display:flex;align-items:center;gap:10px}
.steps li+li::before{content:"→";color:var(--accent);font-weight:700}
.tally{
  margin-top:22px;padding-top:16px;border-top:2px solid var(--ink);
  display:inline-flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;color:var(--muted)
}
.tally b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

/* 釘在牆上的三支短影音，右下角是可立鹿 */
.wall{position:relative;height:clamp(290px,31vw,380px);max-width:520px;width:100%;justify-self:end}
.wall figure{
  position:absolute;margin:0;width:39%;
  background:var(--surface);padding:7px 7px 6px;
  border:1px solid var(--line);
  box-shadow:0 14px 28px -18px rgba(0,0,0,.5);
  transition:transform .18s ease;
}
.wall figure:nth-child(1){left:0;top:9%;transform:rotate(-4deg)}
.wall figure:nth-child(2){left:30.5%;top:0;transform:rotate(1.5deg);z-index:2}
.wall figure:nth-child(3){left:61%;top:10%;transform:rotate(4.5deg)}
.wall figure:hover{transform:rotate(0) translateY(-4px);z-index:3}
.wall figure>img{width:100%;aspect-ratio:5/7;object-fit:cover;background:var(--navy)}
.wall figcaption{font-size:11.5px;color:var(--muted);padding-top:5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{
  position:absolute;top:-7px;left:50%;width:12px;height:12px;margin-left:-6px;
  background:var(--accent);border-radius:50%;z-index:2;
  box-shadow:0 2px 4px rgba(0,0,0,.35)
}
.mascot{
  position:absolute;right:-6px;bottom:-8px;z-index:4;width:clamp(72px,8vw,96px);
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));pointer-events:none
}

/* ---------- filters ---------- */
.filters{
  padding:6px var(--pad) 26px;
  display:grid;gap:10px;
}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow>span{font-size:13px;color:var(--muted);margin-right:4px}
.chip{
  background:transparent;border:1px solid var(--line);border-radius:100px;
  padding:6px 15px;font-size:14px;transition:background .15s,border-color .15s,color .15s;
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.65;margin-left:6px;font-size:12px;font-variant-numeric:tabular-nums}
.share-list{
  margin-left:auto;background:none;border:0;padding:6px 0;
  font-size:13.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px
}
.share-list:hover{color:var(--ink)}

/* ---------- grid ---------- */
.grid{
  padding:0 var(--pad) 80px;
  display:grid;gap:clamp(12px,1.8vw,24px);
  grid-template-columns:repeat(6,minmax(0,1fr));
}
.card{
  background:var(--surface);border:1px solid var(--line);
  text-align:left;padding:0;overflow:hidden;min-width:0;
  display:flex;flex-direction:column;
  transition:transform .18s ease,box-shadow .18s ease;
}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 18px 34px -22px rgba(0,0,0,.55)}
.thumb{position:relative;aspect-ratio:9/16;overflow:hidden;background:var(--navy);width:100%}
.thumb img{width:100%;height:100%;object-fit:cover}
.badge,.flag{
  position:absolute;top:9px;font-size:11.5px;padding:3px 8px;border-radius:3px;letter-spacing:.03em;line-height:1.5
}
.badge{left:9px;background:rgba(22,23,26,.82);color:#fff}
.flag{right:9px;background:var(--accent);color:#fff}
.play{
  position:absolute;right:9px;bottom:9px;
  background:var(--accent);color:#fff;font-size:12px;padding:5px 11px;border-radius:100px;
  box-shadow:0 2px 8px -2px rgba(0,0,0,.5)
}
.pending{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:14px;text-align:center;color:#fff;
}
.pending img{width:44%;height:auto}
.pending strong{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.4}
.pending span{font-size:12.5px;color:rgba(255,255,255,.72)}
.card-body{padding:13px 14px 15px;flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.card-body h3{
  font-family:var(--serif);font-size:17.5px;font-weight:600;margin:0;line-height:1.4;overflow-wrap:anywhere
}
.card-body .co{font-size:13.5px;color:var(--muted)}
.card-body .pay{font-size:14px;font-weight:700;margin-top:auto;padding-top:6px}
.card-body .where{font-size:13px;color:var(--muted)}
.card.closed .thumb{filter:grayscale(1);opacity:.55}
.card.closed .flag{background:var(--ink)}
.empty{
  grid-column:1/-1;padding:70px 0;text-align:center;color:var(--muted)
}
.empty b{display:block;color:var(--ink);font-size:19px;font-family:var(--serif);margin-bottom:8px}

/* ---------- detail overlay ---------- */
.veil{
  position:fixed;inset:0;z-index:60;background:#0E0F11;
  display:none;grid-template-columns:minmax(0,1fr) minmax(320px,430px);
}
.veil.on{display:grid}
body.locked{overflow:hidden}
.stage{
  position:relative;display:grid;place-items:center;
  padding:22px 74px;min-width:0;min-height:0;height:100%;
}
.player{
  height:100%;max-height:calc(100dvh - 44px);max-width:100%;
  aspect-ratio:9/16;background:#000;position:relative;overflow:hidden;
}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player.is-pending{background:var(--navy)}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;
  display:grid;place-items:center;font-size:20px;line-height:1;
  transition:background .15s
}
.nav:hover{background:rgba(255,255,255,.3)}
.nav[disabled]{opacity:.22;cursor:default}
.nav.prev{left:14px}
.nav.next{right:14px}

.panel{
  background:#141517;color:#EDEEF0;overflow-y:auto;padding:52px 30px 30px;
  border-left:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;min-height:0
}
.panel .tag{
  align-self:flex-start;font-size:12px;color:#fff;background:var(--accent);
  padding:3px 10px;border-radius:3px;margin-bottom:12px
}
.panel h2{font-family:var(--serif);font-size:25px;line-height:1.35;margin:0 0 4px;font-weight:600;overflow-wrap:anywhere}
.panel .co{color:#A8ADB5;font-size:14px;margin:0 0 18px}
.notice{
  background:rgba(232,72,28,.16);border:1px solid rgba(232,72,28,.55);color:#FFD9CC;
  font-size:14px;padding:8px 12px;margin:0 0 16px
}
.facts{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;font-size:14px}
.facts dt{color:#A8ADB5}
.facts dd{margin:0}
.facts dd.pay{font-weight:700;color:#fff}
.panel h4{
  font-size:13px;color:#A8ADB5;font-weight:500;margin:20px 0 6px;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.12)
}
.panel .txt{font-size:14.5px;line-height:1.8;color:#D3D6DB;margin:0}
.cta{
  position:sticky;bottom:-30px;margin:24px -30px -30px;padding:14px 30px calc(16px + env(safe-area-inset-bottom,0px));
  background:#141517;border-top:1px solid rgba(255,255,255,.12);display:grid;gap:8px;flex:none
}
.go{
  display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;
  font-weight:700;font-size:16.5px;padding:12px 16px;border-radius:4px;transition:background .15s
}
.go:hover{background:var(--accent-deep)}
.go.off{background:#3A3C41;color:#A8ADB5;pointer-events:none}
.subs{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;font-size:13px}
.subs a,.subs button{background:none;border:0;padding:0;color:#A8ADB5;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.subs a:hover,.subs button:hover{color:#fff}
.shut{
  position:fixed;top:12px;right:14px;z-index:70;
  width:40px;height:40px;border-radius:50%;
  background:rgba(40,41,45,.9);border:1px solid rgba(255,255,255,.25);color:#fff;
  font-size:18px;line-height:1;display:none;place-items:center
}
.veil.on ~ .shut{display:grid}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  z-index:80;background:var(--ink);color:#fff;font-size:14px;padding:8px 16px;border-radius:100px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- footer ---------- */
footer{
  padding:30px var(--pad) 56px;border-top:1px solid var(--line);
  font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 26px
}

/* ---------- admin ---------- */
#admin{display:none;padding:34px var(--pad) 70px;border-top:2px solid var(--ink);background:#DFE0E3}
#admin.on{display:block}
#admin h2{font-family:var(--serif);font-size:24px;margin:0 0 6px}
#admin>p{margin:0 0 22px;color:var(--muted);font-size:14px;max-width:52em}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-width:1000px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.form .wide{grid-column:1/-1}
.form input,.form textarea,.form select{
  font:inherit;font-size:14.5px;color:var(--ink);min-width:0;
  padding:9px 11px;border:1px solid var(--line);background:#fff;border-radius:3px
}
.form textarea{min-height:70px;resize:vertical;line-height:1.7}
.gen{
  margin-top:18px;background:var(--ink);color:#fff;border:0;
  padding:11px 24px;border-radius:100px;font-size:14.5px
}
#out{
  margin-top:18px;display:none;background:#141517;color:#D8DBE0;
  padding:18px;border-radius:4px;font-size:13px;line-height:1.7;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre;overflow-x:auto;max-width:1000px
}
#out.on{display:block}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:980px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero{grid-template-columns:1fr}
  .wall{justify-self:center;max-width:420px;height:clamp(230px,66vw,310px);margin-bottom:6px}
  .veil.on{display:block;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .stage{height:auto;padding:58px 0 14px;display:flex;justify-content:center}
  .player{height:auto;width:min(100vw - 112px,calc((100dvh - 200px) * 9 / 16));max-height:none}
  .panel{border-left:0;overflow:visible;padding:20px 16px 120px}
  .cta{
    position:fixed;left:0;right:0;bottom:0;margin:0;z-index:65;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))
  }
  .nav{position:absolute;top:calc(58px + 30vh);width:38px;height:38px}
  .nav.prev{left:8px}
  .nav.next{right:8px}
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card-body{padding:11px 11px 13px}
  .card-body h3{font-size:16px}
  .card-body .pay{font-size:13px}
  .share-list{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .card:hover{transform:none}
  .ticker-view{overflow-x:auto}
  .ticker-set[aria-hidden="true"]{display:none}
}
</style>
</head>
<body>

<header class="masthead">
  <a class="mark" href="./"><i></i><b>聯成電腦</b><span>職缺短影音牆</span></a>
</header>

<section class="hero">
  <div>
    <h1>一分鐘看懂一個職缺</h1>
    <p>你學到的技能，正是廠商在找的能力。看完短影音線上登記，就輔老師陪你走到面試。連續 14 年政府評鑑 A 級，找工作，你不是一個人。</p>
    <ol class="steps">
      <li>看短影音</li>
      <li>線上登記</li>
      <li>就輔老師聯繫</li>
    </ol>
    <div class="tally" id="tally"></div>
  </div>
  <div class="wall" id="wall"></div>
</section>

<div class="filters">
  <div class="frow" id="f-cat"></div>
  <div class="frow" id="f-area"></div>
</div>

<main class="grid" id="grid"></main>

<section class="ticker" id="ticker" aria-label="學員錄取榜單"></section>

<section id="admin">
  <h2>新增職缺</h2>
  <p>填完按「產生程式碼」，把下方那段複製起來，貼到 index.html 裡 <code>職缺資料</code> 清單的最前面（第一個 <code>{</code> 之前），存檔後重新上傳。這個面板只有網址加上 #edit 時才會出現。影片還沒上傳就把 YouTube 網址留空，之後補上即可。</p>
  <div class="form">
    <label>職類<select id="f-kind"><option>程式開發</option><option>美工設計</option><option>室內建築</option><option>機械產品</option></select></label>
    <label>地區<select id="f-region"><option>北部</option><option>中南部</option></select></label>
    <label>公司全名<input id="f-co" placeholder="日鼎股份有限公司"></label>
    <label>職缺名稱<input id="f-job" placeholder="電控設計繪圖工程師"></label>
    <label>工作地點<input id="f-place" placeholder="台北市中山區"></label>
    <label>薪資<input id="f-pay" placeholder="月薪 36,000 元以上"></label>
    <label>需求人數<input id="f-num" placeholder="2 位"></label>
    <label>學歷<input id="f-edu" placeholder="高中職以上"></label>
    <label>經驗<input id="f-exp" placeholder="2–3 年"></label>
    <label>休假<input id="f-off" placeholder="週休二日"></label>
    <label>有效期限<input id="f-date" placeholder="2026/12/31"></label>
    <label>網址代號（英文小寫）<input id="f-id" placeholder="rihting"></label>
    <label class="wide">YouTube 網址<input id="f-video" placeholder="https://youtube.com/shorts/xxxxxxxxxxx"></label>
    <label class="wide">登記表單網址<input id="f-form" placeholder="https://forms.gle/xxxxxxxx"></label>
    <label class="wide">特別提醒（可留空）<input id="f-note" placeholder="需自備汽車"></label>
    <label class="wide">公司介紹<textarea id="f-about"></textarea></label>
    <label class="wide">工作內容<textarea id="f-work"></textarea></label>
    <label class="wide">條件<textarea id="f-need"></textarea></label>
    <label class="wide">福利<textarea id="f-perk"></textarea></label>
  </div>
  <button class="gen" id="gen">產生程式碼</button>
  <pre id="out"></pre>
</section>

<footer>
  <span>聯成電腦　職缺短影音牆</span>
  <span>薪資、福利以廠商提供資料為準，實際內容以面試時說明為準</span>
</footer>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-label="職缺詳細內容">
  <div class="stage">
    <div class="player" id="player"></div>
    <button class="nav prev" id="prev" aria-label="上一個職缺">‹</button>
    <button class="nav next" id="next" aria-label="下一個職缺">›</button>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

const 職類代碼 = {"程式開發":"A","美工設計":"B","室內建築":"C","機械產品":"D"};
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const 影片ID = u => (String(u||"").match(/(?:shorts\/|youtu\.be\/|v=|embed\/)([\w-]{11})/)||[])[1] || "";
const 簡稱 = 公司 => 公司.replace(/(股份)?有限公司$/,"").replace(/顧問$/,"").replace(/創意$/,"").replace(/設計$/,"");

function 截止日(w){
  const m = String(w.期限||"").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3], 23,59,59) : null;
}
function 狀態(w, now=new Date()){
  const d = 截止日(w);
  if(!d) return {型:"開放"};
  if(d < now) return {型:"截止"};
  const 天 = Math.ceil((d-now)/864e5);
  if(天 <= 30) return {型:"將截止", 字:`${d.getMonth()+1}/${d.getDate()} 截止`};
  return {型:"開放"};
}
const 開放中 = w => 狀態(w).型 !== "截止";

function 封面(id){
  return `<img src="https://i.ytimg.com/vi/${id}/oar2.jpg" data-v="${id}" alt="" loading="lazy">`;
}
document.addEventListener("error",e=>{
  const t = e.target;
  if(t.tagName!=="IMG" || !t.dataset.v) return;
  if(t.src.includes("oar2")) t.src = `https://i.ytimg.com/vi/${t.dataset.v}/hqdefault.jpg`;
  else t.style.visibility = "hidden";
},true);
function 待上傳圖(w){
  return `<div class="pending"><img src="${鹿圖}" alt=""><strong>${esc(簡稱(w.公司))}</strong><span>影片即將上線，現在就能登記</span></div>`;
}

const 符合 = w => (目前職類==="全部"||w.職類===目前職類) && (目前地區==="全部"||w.地區===目前地區);
const 清單 = () => [...職缺資料.filter(符合)].sort((a,b)=>開放中(b)-開放中(a));

function 畫統計(){
  const 開 = 職缺資料.filter(開放中);
  $("#tally").innerHTML =
    `<span>開放中 <b>${開.length}</b> 個職缺</span>
     <span>涵蓋 <b>${new Set(開.map(w=>w.職類)).size}</b> 個職類</span>
     <span>可觀看 <b>${開.filter(w=>影片ID(w.影片)).length}</b> 支短影音</span>`;
}

function 畫牆(){
  $("#wall").innerHTML = 牆圖.map(p=>
    `<figure><i class="pin"></i><img src="${p.圖}" alt="${esc(p.替)}"><figcaption>${esc(p.字)}</figcaption></figure>`
  ).join("") + `<img class="mascot" src="${鹿圖}" alt="聯成電腦吉祥物可立鹿">`;
}
function 畫榜單(){
  const 卡 = 錄取榜單.map(r=>`<li class="hired">
    <span class="face">${r.照片?`<img src="${esc(r.照片)}" alt="">`:esc(r.姓名.charAt(0))}</span>
    <span><span class="top">${esc(r.姓名)}<span class="role">${esc(r.職稱)}</span></span>
    <span class="firm" style="display:block">${esc(r.公司)}</span></span>
  </li>`).join("");
  if(!錄取榜單.length){ $("#ticker").hidden = true; return; }
  $("#ticker").innerHTML = `<div class="ticker-head"><b>學員錄取榜單</b><span>這些學員都成功就業了，您就是下一位！</span></div>
    <div class="ticker-view"><div class="ticker-track"><ul class="ticker-set">${卡}</ul><ul class="ticker-set" aria-hidden="true">${卡}</ul></div></div>`;
}
function 籤(值, 現值, 名, 數){
  return `<button class="chip" aria-pressed="${值===現值}" data-v="${esc(值)}">${esc(名)}<small>${數}</small></button>`;
}
function 畫篩選(){
  const 類 = [...new Set(職缺資料.map(w=>w.職類))];
  const 區 = [...new Set(職缺資料.map(w=>w.地區))];
  const 類數 = c => 職缺資料.filter(w=>(c==="全部"||w.職類===c)&&(目前地區==="全部"||w.地區===目前地區)).length;
  const 區數 = c => 職缺資料.filter(w=>(c==="全部"||w.地區===c)&&(目前職類==="全部"||w.職類===目前職類)).length;
  $("#f-cat").innerHTML = ["全部",...類].map(c=>籤(c,目前職類,c==="全部"?"全部職類":c,類數(c))).join("");
  $("#f-area").innerHTML = ["全部",...區].map(c=>籤(c,目前地區,c==="全部"?"全部地區":c,區數(c))).join("")
    + `<button class="share-list" id="share-list">複製這份清單的連結</button>`;
}
function 畫網格(){
  const 列 = 清單();
  if(!列.length){
    $("#grid").innerHTML = `<div class="empty"><b>這個條件目前沒有職缺</b>換一個職類或地區看看。</div>`;
    return;
  }
  $("#grid").innerHTML = 列.map(w=>{
    const id = 影片ID(w.影片), 態 = 狀態(w);
    const 旗 = 態.型==="截止" ? "已截止" : 態.型==="將截止" ? 態.字 : "";
    return `<button class="card${態.型==="截止"?" closed":""}" data-id="${esc(w.代號)}">
      <div class="thumb">
        ${id ? 封面(id) : 待上傳圖(w)}
        <span class="badge">${esc(w.職類)}</span>
        ${旗?`<span class="flag">${旗}</span>`:""}
        ${id?`<span class="play">▶ 看影片</span>`:""}
      </div>
      <div class="card-body">
        <h3>${esc(w.職缺)}</h3>
        <div class="co">${esc(簡稱(w.公司))}</div>
        <div class="pay">${esc(w.薪資)}</div>
        <div class="where">${esc(w.地點)}</div>
      </div>
    </button>`;
  }).join("");
}
function 畫全部(){ 畫篩選(); 畫網格(); }
function 清單網址尾(){
  const c = 目前職類==="全部" ? "" : (職類代碼[目前職類]||"");
  const a = 目前地區==="全部" ? "" : ({"北部":"N","中南部":"S"}[目前地區]||"");
  return c||a ? "#"+c+a : "";
}
function 改網址(尾){ history.replaceState(null,"",location.pathname+location.search+尾); }

$("#f-cat").addEventListener("click",e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  目前職類 = b.dataset.v; 畫全部(); 改網址(清單網址尾());
});
$("#f-area").addEventListener("click",e=>{
  if(e.target.closest("#share-list")){ 複製(location.origin+location.pathname+清單網址尾(),"已複製這份清單的連結"); return; }
  const b = e.target.closest(".chip"); if(!b) return;
  目前地區 = b.dataset.v; 畫全部(); 改網址(清單網址尾());
});
$("#grid").addEventListener("click",e=>{
  const c = e.target.closest(".card"); if(!c) return;
  站內開啟 = true; 回焦點 = c.dataset.id;
  location.hash = c.dataset.id;
});

/* ---------- 詳細頁 ---------- */
let 現職缺 = null, 站內開啟 = false, 回焦點 = null, 底網址 = "";

function 開啟(w){
  現職缺 = w;
  $("#veil").classList.add("on");
  document.body.classList.add("locked");
  畫詳細();
  $("#shut").focus({preventScroll:true});
}
function 收起(){
  $("#veil").classList.remove("on");
  document.body.classList.remove("locked");
  $("#player").innerHTML = "";
  現職缺 = null;
  if(回焦點){ document.querySelector(`.card[data-id="${回焦點}"]`)?.focus({preventScroll:true}); 回焦點 = null; }
}
function 關閉(){
  if(站內開啟){ 站內開啟 = false; history.back(); }
  else { 改網址(清單網址尾()); 收起(); }
}
function 畫詳細(){
  const w = 現職缺, id = 影片ID(w.影片), 態 = 狀態(w);
  const p = $("#player");
  p.classList.toggle("is-pending", !id);
  p.innerHTML = id
    ? `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1" title="${esc(w.職缺)} 職缺短影音"
         allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`
    : 待上傳圖(w);
  const 列 = [["薪資",w.薪資,"pay"],["地點",w.地點],["人數",w.人數],["學歷",w.學歷],["經驗",w.經驗],["休假",w.休假],["期限",w.期限]];
  const 登記 = 態.型==="截止"
    ? `<span class="go off" aria-disabled="true">這個職缺已截止</span>`
    : `<a class="go" href="${esc(w.表單)}" target="_blank" rel="noopener">我要登記應徵</a>`;
  $("#panel").innerHTML = `
    <span class="tag">${esc(w.職類)}</span>
    <h2>${esc(w.職缺)}</h2>
    <p class="co">${esc(w.公司)}</p>
    ${w.提醒?`<p class="notice">${esc(w.提醒)}</p>`:""}
    <dl class="facts">${列.filter(r=>r[1]).map(r=>`<dt>${r[0]}</dt><dd${r[2]?` class="${r[2]}"`:""}>${esc(r[1])}</dd>`).join("")}</dl>
    ${[["工作內容",w.工作],["條件",w.條件],["福利",w.福利],["公司介紹",w.介紹]].filter(r=>r[1]).map(r=>`<h4>${r[0]}</h4><p class="txt">${esc(r[1])}</p>`).join("")}
    <div class="cta">${登記}
      <div class="subs"><button id="copy-job">複製這個職缺的連結</button>${id?`<a href="https://youtube.com/shorts/${id}" target="_blank" rel="noopener">到 YouTube 觀看</a>`:""}</div>
    </div>`;
  $("#panel").scrollTop = 0;
  $("#veil").scrollTop = 0;
  const 列表 = 清單(), i = 列表.indexOf(w);
  $("#prev").disabled = i<=0;
  $("#next").disabled = i<0 || i>=列表.length-1;
}
function 翻(d){
  const 列表 = 清單(), t = 列表.indexOf(現職缺)+d;
  if(t<0 || t>=列表.length) return;
  現職缺 = 列表[t]; 回焦點 = 現職缺.代號;
  改網址("#"+現職缺.代號);
  畫詳細();
}
function 複製(文字, 訊息){
  const 成 = ()=>吐司(訊息), 敗 = ()=>吐司(文字);
  navigator.clipboard?.writeText(文字).then(成,敗) ?? 敗();
}
let 吐時;
function 吐司(s){
  const t = $("#toast"); t.textContent = s; t.classList.add("on");
  clearTimeout(吐時); 吐時 = setTimeout(()=>t.classList.remove("on"),2600);
}
$("#panel").addEventListener("click",e=>{
  if(e.target.closest("#copy-job")) 複製(location.origin+location.pathname+"#"+現職缺.代號,"已複製這個職缺的連結");
});
$("#prev").onclick = ()=>翻(-1);
$("#next").onclick = ()=>翻(1);
$("#shut").onclick = 關閉;
$("#veil").addEventListener("click",e=>{ if(e.target.id==="veil"||e.target.classList.contains("stage")) 關閉(); });
document.addEventListener("keydown",e=>{
  if(!現職缺) return;
  if(e.key==="Escape") 關閉();
  if(e.key==="ArrowLeft") 翻(-1);
  if(e.key==="ArrowRight") 翻(1);
});

/* ---------- 網址：#A 程式開發、#BS 美工設計＋中南部、#代號 直接開職缺、#edit 新增職缺 ---------- */
function 跟網址(){
  const h = decodeURIComponent(location.hash.slice(1));
  $("#admin").classList.toggle("on", h==="edit");
  const w = 職缺資料.find(x=>x.代號===h);
  if(w){ if(現職缺!==w) 開啟(w); return; }
  if(現職缺) 收起();
  const m = h.match(/^([A-D]?)([NS]?)$/);
  if(m && h){
    目前職類 = Object.keys(職類代碼).find(k=>職類代碼[k]===m[1]) || "全部";
    目前地區 = {N:"北部",S:"中南部"}[m[2]] || "全部";
    畫全部();
  }
}
window.addEventListener("hashchange",跟網址);

/* ---------- 新增職缺表單 ---------- */
$("#gen").onclick = ()=>{
  const v = id => $("#"+id).value.trim();
  const q = JSON.stringify;
  const code =
`  {
    代號:${q(v("f-id"))}, 職類:${q(v("f-kind"))}, 地區:${q(v("f-region"))},
    公司:${q(v("f-co"))}, 職缺:${q(v("f-job"))}, 地點:${q(v("f-place"))},
    薪資:${q(v("f-pay"))}, 人數:${q(v("f-num"))}, 學歷:${q(v("f-edu"))}, 經驗:${q(v("f-exp"))}, 休假:${q(v("f-off"))},
    期限:${q(v("f-date"))},${v("f-note")?` 提醒:${q(v("f-note"))},`:""}
    影片:${q(v("f-video"))}, 表單:${q(v("f-form"))},
    介紹:${q(v("f-about"))},
    工作:${q(v("f-work"))},
    條件:${q(v("f-need"))},
    福利:${q(v("f-perk"))}
  },`;
  const out = $("#out");
  out.textContent = code;
  out.classList.add("on");
  navigator.clipboard?.writeText(code).catch(()=>{});
};

畫統計(); 畫榜單(); 畫牆(); 畫全部(); 跟網址();
</script>
</body>
